<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="'Noto Serif JP','Hiragino Mincho ProN',serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F5EF"/>
      <stop offset="1" stop-color="#EFEBE0"/>
    </linearGradient>
  </defs>
  <rect width="820" height="300" fill="url(#bg)"/>
  <rect x="0" y="0" width="820" height="6" fill="#586049"/>

  <text x="60" y="70" font-size="16" letter-spacing="6" fill="#586049" font-weight="500">CLUB BORDERLESS</text>
  <line x1="60" y1="86" x2="96" y2="86" stroke="#7C8B6F" stroke-width="2"/>

  <text x="60" y="138" font-size="38" fill="#2C302B" font-weight="600">民泊・旅館業</text>
  <text x="60" y="186" font-size="38" fill="#2C302B" font-weight="600">物件購入シミュレーター</text>

  <text x="60" y="228" font-size="18" fill="#6B6F66" font-family="'Noto Sans JP',sans-serif">物件価格と条件を入れるだけ。自己資金・返済・月の手残りがすぐ分かる。</text>

  <!-- result chip -->
  <rect x="60" y="248" width="300" height="34" rx="17" fill="#586049"/>
  <text x="80" y="271" font-size="16" fill="#FFFFFF" font-family="'Noto Sans JP',sans-serif">月の手残り　+¥15,051 / 月</text>

  <!-- mini bar motif -->
  <g transform="translate(648,150)">
    <rect x="0"  y="40" width="22" height="50" rx="3" fill="#C9CDBE"/>
    <rect x="34" y="20" width="22" height="70" rx="3" fill="#9CA68C"/>
    <rect x="68" y="0"  width="22" height="90" rx="3" fill="#586049"/>
    <circle cx="79" cy="-14" r="9" fill="#A8744F"/>
  </g>
  <text x="690" y="270" font-size="15" fill="#A8744F" font-family="'Noto Sans JP',sans-serif" font-weight="700" text-anchor="middle">試算する →</text>
</svg>
